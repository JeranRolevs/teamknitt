[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teamknitt"
version = "0.3.0"
description = "Configure and monitor task, goal and brainstorming teams powered by Labtune"
authors = [{name = "Goran Mitevski"}]
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Labtune-Academic-Research-2.0"
license-files = ["LICENSE", "LICENSING.md"]
dependencies = ["PyYAML>=6,<7", "jsonschema>=4,<5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/JeranRolevs/teamknitt"
Issues = "https://github.com/JeranRolevs/teamknitt/issues"
License = "https://github.com/JeranRolevs/teamknitt/blob/main/LICENSE"

[project.optional-dependencies]
bayesian = ["scipy>=1.10"]
memory = ["numpy>=1.24", "scipy>=1.10", "psutil>=5.9"]
diagrams = ["matplotlib>=3.6", "Pillow>=9"]

[project.scripts]
teamknitt = "teamknitt.cli:main"
labtune = "labtune.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["labtune*", "teamknitt*"]
namespaces = false

[tool.setuptools.package-data]
"labtune.schemas" = ["*.json"]
"labtune.resources" = ["*.yaml", "starter/**/*", "visualization/*"]

"teamknitt.resources" = ["*.json", "*.yaml", "*.md", "*.html", "*.js", "task-starter/**/*", "research-starter/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["TEAMKNITT_FOUNDATIONS.md", "**/TEAMKNITT_FOUNDATIONS.md", "[Ff]oundations*", "**/[Ff]oundations*", "[Ff]undations*", "**/[Ff]undations*"]
