name: Standalone teamknitt offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[memory]'
      - run: python tools/sync_starter.py --check
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s examples/memory_retention/tests -v
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python tools/check_release.py --artifacts dist
      - run: python -m venv --system-site-packages "${{ runner.temp }}/teamknitt-wheel-venv"
      - run: '"${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m pip install --force-reinstall --no-deps dist/*.whl'
      - run: |
          cd "${{ runner.temp }}"
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt engine init portable-text
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt engine --project portable-text check
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt engine --project portable-text study prepare --workspace portable-text
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt engine init portable-memory --template memory
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt engine --project portable-memory study prepare --workspace portable-memory
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt engine --project portable-text visualize --workspace portable-text --variant single --output portable-view.html
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt engine init portable-scientist --template scientist
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt engine --project portable-scientist study prepare --workspace portable-scientist
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt engine --project portable-scientist visualize --workspace portable-scientist --variant scientist-persistent --sequences 3 --effort-mode budget --output portable-scientist.html
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt engine init portable-labs --template multi-lab
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt engine --project portable-labs study prepare --workspace portable-labs --multi-lab
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt engine --project portable-labs visualize --workspace portable-labs --multi-lab --output portable-labs.html
      - run: |
          cd "${{ runner.temp }}"
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt engine init portable-specialist --template memory --decision-backend typed
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt engine --project portable-specialist study prepare --workspace portable-specialist
      - if: runner.os == 'macOS'
        name: Qualify memory sandbox
        run: |
          cd "${{ runner.temp }}"
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt engine --project portable-memory study qualify --workspace portable-memory
      - if: failure() && runner.os == 'macOS'
        name: Show sandbox qualification diagnostics
        env:
          TEAMKNITT_QUALIFICATION_DIR: ${{ runner.temp }}/portable-memory/setup/memory_qualification
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          print(f"Python: {sys.executable}; base prefix: {sys.base_prefix}")
          root = Path(os.environ["TEAMKNITT_QUALIFICATION_DIR"])
          for path in sorted(root.rglob("*")):
              if path.name in {"stderr.log", "result.json", "sandbox.sb"} and path.is_file():
                  print(f"{path.relative_to(root)}:\n{path.read_text()[-8000:]}")
          PY

      - name: Portable teamknitt task-team wheel smoke test (offline)
        run: |
          cd "${{ runner.temp }}"
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt init portable-team --members 4 --topology ring --purpose brainstorm --goal "Explore welcoming workshop formats."
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt check --workspace portable-team
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt configure --workspace portable-team --members 5 --topology hub_and_spoke --communication intermediate
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt prepare --workspace portable-team
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt view --workspace portable-team --output portable-team-plan.html
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt demo --workspace portable-team --policy connected
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt demo --workspace portable-team --policy fragmented
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" - <<'PY'
          from pathlib import Path
          from teamknitt.reporting import build_report
          from teamknitt.observatory import snapshot
          records = sorted(Path("portable-team/trials").iterdir())
          assert len(records) == 2
          summaries = [build_report(p) for p in records]
          agreement = [s["snapshots"][-1]["reported_plan_pair_agreement"] for s in summaries]
          assert max(agreement) == 1 and min(agreement) < 1
          assert all(s["usage"]["provider_requests"] == 0 and s["goal_achieved"] is None for s in summaries)
          assert all(s["observations"]["aggregate_score"] is None for s in summaries)
          snapshot(summaries[0], Path("portable-team-process.html"))
          PY
      - name: Advanced and optional starter compatibility (offline)
        run: |
          cd "${{ runner.temp }}"
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt init portable-research --template research
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt check --workspace portable-research
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt probes init portable-probes
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt probes check --workspace portable-probes

      - name: Complementary views and expanded portable topologies (offline)
        run: |
          cd "${{ runner.temp }}"
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt view --workspace portable-team --group complexity --section team_dynamics --output portable-complexity.html
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt probes demo --workspace portable-probes --policy fragile
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" - <<'PY'
          from pathlib import Path
          from teamknitt.builder import make_configuration
          from teamknitt.config import compile_plan
          from teamknitt.cli import main
          from teamknitt.topology import TOPOLOGIES
          assert len(TOPOLOGIES) == 14
          for kind in TOPOLOGIES:
              plan = compile_plan(Path("portable-team"), make_configuration(topology=kind, count=4))
              assert plan["provider_request_cap"] == 24 and plan["api_calls"] == 0
          probe_runs = list(Path("portable-probes/runs").iterdir())
          assert len(probe_runs) == 1
          assert main(["view", "--workspace", "portable-team", "--group", "standard", "--section", "collaborative_intelligence",
                       "--probe-run", str(probe_runs[0]), "--output", "portable-teammate-view.html"]) == 0
          PY

      - name: Verify single namespace and grouped standalone views
        run: |
          cd "${{ runner.temp }}"
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" - <<'PY'
          import importlib.util, importlib.metadata
          from pathlib import Path
          from teamknitt.views import GROUPS, VIEWS, resolve_view, catalogue
          from teamknitt.engine.planning import STATISTICAL_APPROACHES
          from teamknitt import engine
          assert importlib.util.find_spec("labtune") is None
          assert set(GROUPS) == {"non_system", "system"}
          assert len(VIEWS) == 6
          assert VIEWS["collaborative_intelligence"]["group"] == "non_system"
          assert VIEWS["distributed_problem_solving"]["group"] == "system"
          assert VIEWS["transactive_memory"]["group"] == "system"
          assert resolve_view("standard")[0] == "non_system"
          assert resolve_view("complexity")[0] == "system"
          assert set(catalogue()["research_background"]["axes"]) == {"explanatory_locus", "form_of_emergence", "kind_of_record"}
          assert STATISTICAL_APPROACHES == ("frequentist",)
          assert "site-packages" in str(Path(engine.__file__))
          dist = importlib.metadata.distribution("teamknitt")
          assert {e.name for e in dist.entry_points if e.group == "console_scripts"} == {"teamknitt"}
          PY

      - name: Multiple native teams, optional routes and portable views (offline)
        run: |
          cd "${{ runner.temp }}"
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt teams init portable-teams --members 1 --goal "Propose a bounded CSV validation CLI."
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt teams check --workspace portable-teams
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt teams prepare --workspace portable-teams
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt teams view --workspace portable-teams --output portable-teams-config.html
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt teams demo --workspace portable-teams
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt teams connect --workspace portable-teams --profile summaries --source alpha --target beta --apply
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt teams demo --workspace portable-teams
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" -m teamknitt teams view --workspace portable-teams --team beta --output portable-teams-beta.html
          "${{ runner.temp }}/teamknitt-wheel-venv/bin/python" - <<'PY'
          from pathlib import Path
          from teamknitt.teams.reporting import report
          records = [report(p) for p in sorted(Path("portable-teams/trials").iterdir())]
          assert len(records) == 2
          assert all(r["provider_requests"] == 0 and r["goal_achieved"] is None and r["automatic_winner"] is None for r in records)
          disconnected = next(r for r in records if r["communication"]["profile"] == "none")
          connected = next(r for r in records if r["communication"]["profile"] == "summaries")
          assert disconnected["exchange"] == []
          exposures = [e for e in connected["exchange"] if e["kind"] == "team_exchange_exposed"]
          assert exposures and all(e["source_team"] == "alpha" and e["target_team"] == "beta" and e["from_wave"] < e["to_wave"] for e in exposures)
          assert all(r["status"] == "completed_team_collection" for r in records)
          PY
