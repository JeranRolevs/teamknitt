schema_version: 1
name: single-scientist-lab
problem_file: mission/problem.md
provider:
  adapter: chat_completions
  base_url: https://provider.example.invalid/v1
  endpoint: /chat/completions
  models_endpoint: null
  model: YOUR_MODEL_ID
  api_key_env: TEAMKNITT_API_KEY
  env_file: .env
  timeout_seconds: 90
  max_output_tokens: 8192
  max_parallel_requests: 1
  request_options: {}
runtime:
  mode: text_only
  max_actions_per_episode: 4
  max_findings: 4
  comparison_metrics: []
base_overrides:
  single_scientist:
    sequences: 1
    effort_mode: fixed_passes
    context_policy: continue
  teams:
    max_depth: 0
    max_children_per_agent: 0
    max_active_descendants: 0
  resources:
    max_active_agents: 1
    max_llm_requests: 1
    max_experiments: 1
  budget:
    max_llm_calls: 32
    max_wall_seconds: 900
  decisions:
    mode: llm_only
    specialist: null
    allowed_specs:
    - semantic_choice.v1
variants:
- id: scientist-low
  overrides:
    single_scientist:
      persistence: low
- id: scientist-medium
  overrides:
    single_scientist:
      persistence: medium
- id: scientist-persistent
  overrides:
    single_scientist:
      persistence: persistent
