schema_version: 1
name: my-multi-lab-study
problem_file: mission/problem.md
provider:
  adapter: chat_completions
  base_url: https://provider.example.invalid/v1
  endpoint: /chat/completions
  models_endpoint: null
  model: YOUR_MODEL_ID
  api_key_env: TEAMKNITT_API_KEY
  env_file: .env
  timeout_seconds: 90
  max_output_tokens: 8192
  max_parallel_requests: 2
  request_options: {}
runtime:
  mode: text_only
  max_actions_per_episode: 4
  max_findings: 4
  comparison_metrics: []
base_overrides:
  budget:
    max_llm_calls: 32
    max_wall_seconds: 1200
  teams:
    max_depth: 0
    max_children_per_agent: 0
    max_active_descendants: 0
  decisions:
    mode: llm_only
    specialist: null
    allowed_specs: [semantic_choice.v1]
variants:
  - id: silos
    overrides:
      lab:
        design_file: lab_designs/A-multidisciplinary-silos.md
      communication:
        profile: high
        wisdom: true
  - id: scientist
    overrides:
      lab:
        design_file: lab_designs/F-single-scientist.md
      single_scientist:
        persistence: medium
        sequences: 1
        effort_mode: fixed_passes
        context_policy: continue
multi_lab:
  labs:
    - id: mesa
      variant: silos
    - id: arroyo
      variant: scientist
  sequences: 2
  context_policy: continue
  communication:
    profile: wisdom_only
    wisdom: true
    max_read_words: 700
  meeting:
    kind: symposium
    discussion_rounds: 1
  budget:
    max_llm_calls: 64
    max_wall_seconds: 1200
  resources:
    max_active_labs: 2
    max_llm_requests: 2
    max_experiments: 2
