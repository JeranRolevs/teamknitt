# Explicit alternative, not an automatically selected or preferred team.
schema_version: 2
name: Independent contributions to a unitary research judgement
labtune:
  variant: independent
cognition:
  perspectives:
  - distributed_cognition
  - information_processing
  context:
    setting: A research team develops an evidence-grounded study proposal; no scientific result is assumed.
    tools:
    - versioned_research_notes
    - explicit_handoffs
    - expertise_directory
    constraints:
    - User-provided source notes are inputs, not independently verified findings.
    - Role labels and capability assignments do not establish actual expertise.
  task:
    structure: unitary
    interaction: independent
    goal: Develop independent positions on one research judgement without peer research exchange. No automatic
      aggregation or winner is assumed.
    success_criteria:
    - Trace a proposal to the source representations each contributor actually encountered.
    - Distinguish a shared plan from a correct or validated plan.
    - Record missing handoffs and conflicting temporal expectations rather than forcing consensus.
  roles:
  - actor: mechanism_lead.1
    responsibilities:
    - Develop explanatory hypotheses and expose assumptions.
    expertise:
    - mechanism_design
    - falsification
    perspective: Prefer explicit mechanisms and discriminating explanations, without treating elegance
      as evidence.
    capabilities:
    - interpret
    - synthesize
    - acknowledge
  - actor: measurement_lead.1
    responsibilities:
    - Develop a bounded measurement plan and challenge untested claims.
    expertise:
    - measurement_design
    - uncertainty
    perspective: Prefer measured receipts and explicit uncertainty, without treating a numerical claim
      as verified.
    capabilities:
    - interpret
    - synthesize
    - acknowledge
  representations:
  - id: mechanism-source
    kind: source
    purpose: Role-local explanatory background supplied by the researcher.
    format: markdown
    path: mission/cognition/mechanism.md
    readers:
    - mechanism_lead.1
    writers: []
  - id: measurement-source
    kind: source
    purpose: Complementary measurement constraints supplied by the researcher.
    format: markdown
    path: mission/cognition/measurement.md
    readers:
    - measurement_lead.1
    writers: []
  - id: mechanism-note
    kind: workspace
    purpose: Externalize the explanation with source/version provenance for the other role.
    format: structured_note
    readers:
    - mechanism_lead.1
    writers:
    - mechanism_lead.1
  - id: measurement-note
    kind: workspace
    purpose: Externalize measurement constraints and uncertainty rather than rely on shared private memory.
    format: structured_note
    readers:
    - measurement_lead.1
    writers:
    - measurement_lead.1
  work:
  - id: explain
    phase: independent_positions
    actors:
    - mechanism_lead.1
    goal: Form a falsifiable explanatory proposal using the mechanism source.
    inputs:
    - mechanism-source
    outputs:
    - mechanism-note
    depends_on: []
  - id: measure
    phase: independent_positions
    actors:
    - measurement_lead.1
    goal: Form a measurement proposal using the measurement source.
    inputs:
    - measurement-source
    outputs:
    - measurement-note
    depends_on: []
  handoffs: []
  expertise_directory: []
  temporal_reference:
    order:
    - independent_positions
    - parallel_episodes
    - paired_challenge
    - discriminating_test
    - verification
    deadline_wave: 6
  affordances:
  - id: externalize-explanation
    actors:
    - mechanism_lead.1
    capability: synthesize
    requires:
    - mechanism-source
    operation: publish
    target: mechanism-note
    purpose: Make an explanation available for another role's work.
  - id: externalize-measurement
    actors:
    - measurement_lead.1
    capability: synthesize
    requires:
    - measurement-source
    operation: publish
    target: measurement-note
    purpose: Make measurement constraints available for another role's work.
  memory:
    max_words_per_representation: 160
dynamics:
  stable_waves: 2
  perturbations: []
