# Labtune engine settings. Team topology/count/sharing live in team.yaml.
schema_version: 1
name: teamknitt-workspace
problem_file: mission/task.md
provider:
  adapter: chat_completions
  base_url: https://provider.example.invalid/v1
  endpoint: /chat/completions
  models_endpoint: null
  model: YOUR_MODEL_ID
  api_key_env: LABTUNE_API_KEY
  env_file: .env
  timeout_seconds: 30
  max_output_tokens: 2048
  max_parallel_requests: 2
  request_options: {}
runtime:
  mode: text_only
  max_actions_per_episode: 2
  max_findings: 4
  comparison_metrics: []
base_overrides:
  budget:
    max_llm_calls: 24
    max_wall_seconds: 600
  teams:
    max_depth: 0
    max_children_per_agent: 0
    max_active_descendants: 0
  decisions:
    mode: llm_only
    specialist: null
    allowed_specs: [semantic_choice.v1]
variants:
  - id: team
    overrides:
      lab:
        design_file: designs/task-team.md
